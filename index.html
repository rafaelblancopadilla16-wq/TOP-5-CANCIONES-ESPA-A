
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOP 5 España</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #222;
  background: #fff;
}

header {
  height: 58px;
  padding: 0 20px;
  border-bottom: 1px solid #eee;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: -1px;
}

.logo span { color: #e53945; }

header small {
  color: #888;
  font-size: 10px;
  letter-spacing: 1px;
}

main {
  max-width: 650px;
  margin: 30px auto;
  padding: 0 15px;
}

.heading {
  margin-bottom: 20px;
}

.heading h1 {
  font-size: 27px;
  letter-spacing: -1px;
  margin: 0 0 6px;
}

.heading h1 span { color: #e53945; }

.heading p {
  color: #888;
  font-size: 12px;
  margin: 0;
}

.status {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  font-size: 11px;
  color: #888;
}

.dot {
  display: inline-block;
  height: 7px;
  width: 7px;
  background: #39b978;
  border-radius: 50%;
  margin-right: 5px;
}

.song {
  display: grid;
  grid-template-columns: 28px 57px 1fr;
  align-items: center;
  gap: 12px;
  padding: 11px 8px;
  border-bottom: 1px solid #eee;
}

.number {
  font-size: 20px;
  font-weight: 800;
  color: #ccc;
  text-align: center;
}

.song:first-child .number { color: #e53945; }

.cover {
  width: 57px;
  height: 57px;
  border-radius: 6px;
  object-fit: cover;
  background: #f4f4f4;
}

.info { min-width: 0; }

.info h3 {
  font-size: 13px;
  margin: 0 0 5px;
  overflow-wrap: anywhere;
}

.info p {
  color: #888;
  font-size: 11px;
  margin: 0 0 7px;
}

.links {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.links a {
  font-size: 10px;
  font-weight: bold;
  text-decoration: none;
  padding: 5px 8px;
  border-radius: 4px;
}

.spotify { color: #168348; background: #e8f5ed; }
.youtube { color: #d52c36; background: #fff0f0; }
.apple { color: #6252b4; background: #f0efff; }

.loading, .error {
  padding: 35px 10px;
  text-align: center;
  font-size: 12px;
  color: #888;
}

button {
  border: 0;
  color: #e53945;
  background: none;
  cursor: pointer;
  font-size: 11px;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 22px 10px;
  color: #999;
  font-size: 10px;
  border-top: 1px solid #eee;
}

@media(max-width: 400px) {
  main { padding: 0 10px; }
  .song { gap: 8px; }
  .cover { width: 50px; height: 50px; }
  .song { grid-template-columns: 23px 50px 1fr; }
}
</style>
</head>

<body>

<header>
  <div class="logo">TOP 5<span>.</span>ES</div>
  <small>ESPAÑA · MÚSICA</small>
</header>

<main>
  <div class="heading">
    <h1>Lo más escuchado <span>en España.</span></h1>
    <p>Las cinco canciones líderes del ranking diario.</p>
  </div>

  <div class="status">
    <span><i class="dot"></i><span id="status">Conectando...</span></span>
    <button onclick="loadSongs()">↻ Actualizar</button>
  </div>

  <section id="songs" class="loading">
    Cargando ranking...
  </section>
</main>

<footer>
  TOP 5.ES · Ranking diario de Spotify España<br>
  Fuente: Kworb · Portadas y catálogo: Apple Music
</footer>

<script>
const CHART =
  "https://r.jina.ai/http://www.kworb.net/spotify/country/es_daily.html";

const container = document.getElementById("songs");
const statusText = document.getElementById("status");

function makeLink(name, url, cls) {
  const a = document.createElement("a");
  a.href = url;
  a.textContent = name;
  a.className = cls;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  return a;
}

async function getCover(title, artist) {
  try {
    const term = encodeURIComponent(title + " " + artist);
    const response = await fetch(
      "https://itunes.apple.com/search?term=" +
      term + "&entity=song&limit=5&country=ES"
    );

    if (!response.ok) throw new Error("Error de catálogo");

    const data = await response.json();

    const match = data.results.find(song =>
      song.trackName.toLowerCase() === title.toLowerCase()
    ) || data.results[0];

    return match ? {
      image: match.artworkUrl100.replace(
        "100x100bb", "300x300bb"
      ),
      url: match.trackViewUrl
    } : null;

  } catch (e) {
    return null;
  }
}

async function loadSongs() {
  container.className = "loading";
  container.textContent = "Actualizando canciones...";
  statusText.textContent = "Conectando con el ranking";

  try {
    const response = await fetch(CHART, {
      cache: "no-store"
    });

    if (!response.ok) throw new Error("Ranking no disponible");

    const text = await response.text();

    const rows = [...text.matchAll(
      /^\|\s*(\d+)\s*\|[^|]*\|\s*([^|]+)\|/gm
    )];

    const songs = rows
      .map(row => {
        const position = Number(row[1]);
        const full = row[2].trim();
        const separator = full.indexOf(" - ");

        if (separator < 0 || position > 5) return null;

        return {
          position,
          artist: full.slice(0, separator).trim(),
          title: full.slice(separator + 3).trim()
        };
      })
      .filter(Boolean)
      .sort((a,b) => a.position - b.position);

    if (songs.length !== 5) {
      throw new Error("No se encontraron las cinco canciones");
    }

    const cards = await Promise.all(
      songs.map(async song => {
        const cover = await getCover(song.title, song.artist);
        return { ...song, cover };
      })
    );

    container.replaceChildren();
    container.className = "";

    cards.forEach(song => {
      const row = document.createElement("article");
      row.className = "song";

      const number = document.createElement("div");
      number.className = "number";
      number.textContent = song.position;

      const img = document.createElement("img");
      img.className = "cover";
      img.alt = "Portada de " + song.title;
      img.src = song.cover?.image || "";
      img.onerror = () => {
        img.style.visibility = "hidden";
      };

      const info = document.createElement("div");
      info.className = "info";

      const title = document.createElement("h3");
      title.textContent = song.title;

      const artist = document.createElement("p");
      artist.textContent = song.artist;

      const links = document.createElement("div");
      links.className = "links";

      const query = encodeURIComponent(
        song.title + " " + song.artist
      );

      links.append(
        makeLink("Spotify ↗",
          "https://open.spotify.com/search/" + query,
          "spotify"),
        makeLink("YouTube ↗",
          "https://www.youtube.com/results?search_query=" + query,
          "youtube")
      );

      if (song.cover?.url) {
        links.append(
          makeLink("Apple Music ↗", song.cover.url, "apple")
        );
      }

      info.append(title, artist, links);
      row.append(number, img, info);
      container.append(row);
    });

    statusText.textContent =
      "Ranking diario · Consultado " +
      new Date().toLocaleTimeString("es-ES", {
        hour: "2-digit",
        minute: "2-digit"
      });

  } catch (error) {
    console.error(error);

    container.className = "error";
    container.replaceChildren();

    const message = document.createElement("p");
    message.textContent =
      "No se ha podido obtener el ranking. Puede que la fuente esté temporalmente fuera de servicio.";

    const retry = document.createElement("button");
    retry.textContent = "Intentar de nuevo";
    retry.onclick = loadSongs;

    container.append(message, retry);
    statusText.textContent = "Error de conexión";
  }
}

loadSongs();

// El ranking es diario: se vuelve a consultar cada 6 horas.
setInterval(loadSongs, 6 * 60 * 60 * 1000);
</script>

</body>
</html>
